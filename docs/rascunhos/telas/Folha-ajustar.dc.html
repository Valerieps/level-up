<x-dc>
<helmet>
<style>
body{margin:0}

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--canvas); color: var(--ink); font-family: var(--font-body);">
  <div aria-hidden="true" style="padding: 40px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-family: var(--font-display); font-size: 26px; line-height: 32px; font-weight: 600;">Academia</div>
    <div style="font-size: 15px; color: var(--ink-muted);">Média · seg, qua e sex</div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(16, 10, 18, 0.45);"></div>

    <div class="am-sheet-grab"></div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h2 id="t">Deixar do tamanho certo</h2>
      <p style="font-size: 15px; line-height: 22px; color: var(--ink-muted);">O que está pesando? <span style="font-size: 13px;">(opcional)</span></p>
    </div>
    <div role="radiogroup" aria-label="O que está pesando" style="display: flex; flex-wrap: wrap; gap: 8px;">
      <button role="radio" aria-checked="true" style="font: inherit; font-size: 14px; font-weight: 600; min-height: 40px; padding: 0 14px; border-radius: var(--radius-full); border: 2px solid var(--primary); background: var(--primary-soft); color: var(--primary-ink);">É grande demais</button>
      <button role="radio" aria-checked="false" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink);">O dia não encaixa</button>
      <button role="radio" aria-checked="false" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink);">A vida está corrida</button>
      <button role="radio" aria-checked="false" style="font: inherit; font-size: 14px; min-height: 40px; padding: 0 14px; border-radius: var(--radius-full); border: 1px solid var(--line-strong); background: var(--surface-raised); color: var(--ink);">Não sei bem</button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-muted);">MAIS ÚTEIS PARA ISSO</span>
      <button class="am-choice" style="border: 2px solid var(--primary);"><span>Diminuir o tamanho<small>Média → Fácil, ou menos dias</small></span><span class="am-xpdelta">15 → 10 XP</span></button>
      <button class="am-choice" style="border: 2px solid var(--primary);"><span>Criar a versão mínima<small>Ex.: 10 minutos de alongamento</small></span><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      <span style="font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-muted); margin-top: 6px;">OUTRAS OPÇÕES</span>
      <button class="am-choice" style="min-height: 48px;"><span>Mudar os dias</span><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      <button class="am-choice" style="min-height: 48px;"><span>Transformar em livre</span><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
      <a class="am-choice" href="Folha-pausar.dc.html" style="min-height: 48px;"><span>Pausar só este hábito</span><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
    </div>
    <p style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">Ajustar não tira nada: estrelas, selos, conquistas e histórico ficam.</p>
  </section>
</div>
