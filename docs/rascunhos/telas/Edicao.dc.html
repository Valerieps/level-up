<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editar hábito</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ameixa/tokens.css">
<link rel="stylesheet" href="ds/ameixa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-body);">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 8px 4px;">
    <a class="am-btn am-btn-ghost" href="Detalhe.dc.html" style="color: var(--ink);">Cancelar</a>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 17px; line-height: 22px; font-weight: 600;">Editar hábito</h1>
    <a class="am-btn am-btn-ghost" href="Detalhe.dc.html">Salvar</a>
  </header>

  <main style="flex: 1; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 20px;">
    <div class="am-field"><label for="nome">Nome</label><input id="nome" class="am-input" value="Ler 30 minutos"></div>

    <div class="am-field">
      <label id="lbl-regra">Quando</label>
      <div class="am-seg" role="group" aria-labelledby="lbl-regra" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));">
        <button aria-pressed="false">Diário</button>
        <button aria-pressed="false">Dias específicos</button>
        <button aria-pressed="true">Livre</button>
      </div>
      <div role="note" style="display: flex; gap: 10px; align-items: flex-start; margin-top: 4px; padding: 12px; border-radius: var(--radius-md); background: var(--warning-soft); color: var(--warning); font-size: 14px; line-height: 20px;">
        <svg class="am-ic" style="margin-top: 1px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5M12 16h.01"></path></svg>
        <span>Ao trocar a regra, o streak e a contagem para Automatizado recomeçam. Estrelas e selos ficam.</span>
      </div>
    </div>

    <div class="am-field">
      <span style="font-size: 13px; line-height: 18px; font-weight: 600;">Régua</span>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 4px 0 14px; border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--surface);">
        <span style="display: flex; flex-direction: column;"><span style="font-weight: 600;">Fácil · seg a sex</span><span class="am-num" style="font-size: 12px; color: var(--ink-muted);">12 XP por conclusão</span></span>
        <a class="am-btn am-btn-ghost" href="Folha-subir.dc.html" style="padding: 0 10px; font-size: 14px;">Subir ou baixar</a>
      </div>
      <span class="am-help">Dificuldade, meta e dias mudam pela régua, para as Estrelas de Coragem contarem certo.</span>
    </div>

    <div class="am-field"><label for="minima">Versão mínima <span style="font-weight: 400; color: var(--ink-muted);">(opcional)</span></label><input id="minima" class="am-input" value="Ler 1 página"></div>

    <div style="margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px;">
      <button class="am-btn am-btn-ghost am-btn-block" style="color: var(--ink);">Arquivar hábito</button>
      <a class="am-btn am-btn-ghost am-btn-block" href="Excluir.dc.html" style="color: var(--danger);">Excluir hábito</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
