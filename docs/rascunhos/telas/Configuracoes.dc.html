<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Configurações</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/ameixa/tokens.css">
<link rel="stylesheet" href="ds/ameixa/components/bundle.css">
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column; background: var(--canvas); color: var(--ink); font-family: var(--font-body);">
  <header style="display: flex; align-items: center; gap: 4px; padding: 16px 8px 8px;">
    <a class="am-btn am-btn-ghost" href="Perfil.dc.html" style="padding: 0 8px; color: var(--ink);" aria-label="Voltar para Perfil"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin: 0; font-family: var(--font-display); font-size: 22px; line-height: 28px; font-weight: 600;">Configurações</h1>
  </header>

  <main style="flex: 1; padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 28px;">
    <section style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-muted);">DIA</h2>
      <button style="font: inherit; display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); text-align: left; cursor: pointer;">
        <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-size: 15px; font-weight: 600;">Virada do dia</span><span style="font-size: 13px; color: var(--ink-muted);">Quando o "Hoje" termina e começa outro dia</span></span>
        <span class="am-num" style="font-size: 15px; color: var(--primary-ink);">04:00</span>
      </button>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-muted);">MODO PAUSA</h2>
      <label class="am-toggle-row" for="pausa-app" style="min-height: 56px; border-bottom: 1px solid var(--line);"><span style="display: flex; flex-direction: column;"><span style="font-weight: 600;">Pausar o app inteiro</span><span style="font-size: 13px; color: var(--ink-muted);">Streaks e contagens ficam congelados</span></span><input id="pausa-app" type="checkbox" class="am-switch" role="switch"></label>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line);">
        <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">Meditar 15 minutos</span><span style="font-size: 13px; color: var(--ink-muted);">Pausado até 18 nov</span></span>
        <button class="am-btn" style="min-height: 36px; padding: 0 14px;">Voltar</button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 4px;">
      <h2 style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink-muted);">CONTA</h2>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line);">
        <span style="flex: 1; display: flex; flex-direction: column;"><span style="font-weight: 600;">E-mail</span><span style="font-size: 13px; color: var(--ink-muted);">voce@exemplo.com</span></span>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line);">
        <span style="flex: 1; font-weight: 600;">Sincronização</span>
        <span class="am-badge am-badge-success"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>Tudo salvo</span>
      </div>
      <a class="am-btn am-btn-block" href="Entrada.dc.html" style="margin-top: 16px;">Sair</a>
      <button class="am-btn am-btn-ghost am-btn-block" style="color: var(--danger);">Excluir conta</button>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
