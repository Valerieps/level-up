<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Field</title></head>
<body>
<div class="am-stack" style="gap:16px">
  <div class="am-field"><label for="nm">Nome do hábito</label><input id="nm" class="am-input" value="Ler 30 minutos"></div>
  <div class="am-field"><label id="lbl-rule">Regra de tempo</label><div class="am-seg" role="group" aria-labelledby="lbl-rule"><button aria-pressed="false">Livre</button><button aria-pressed="true">Dias específicos</button><button aria-pressed="false">Diário</button></div></div>
  <div class="am-field is-invalid"><label for="mn">Versão mínima</label><input id="mn" class="am-input" value=""><span class="am-help">Escreva algo de uns 2 minutos, como "Ler 1 página".</span></div>
</div>
</body>
</html>
