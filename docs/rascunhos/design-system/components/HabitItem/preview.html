<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>HabitItem</title></head>
<body>
<div class="am-stack">
  <div class="am-item"><button class="am-mark is-count" style="--p:37.5%" aria-label="Avançar contador, 3 de 8"><span>3/8</span></button><div class="am-item-body"><span class="am-item-name">Beber 8 copos de água</span><span class="am-item-meta">Streak <span class="am-num">12</span></span></div></div>
  <div class="am-item"><button class="am-mark" aria-label="Marcar Ler 30 minutos como feito"></button><div class="am-item-body"><span class="am-item-name">Ler 30 minutos</span><span class="am-item-meta"><span class="am-badge am-badge-auto">Automatizado</span><span class="am-stars" aria-label="2 Estrelas de Coragem">★★</span>Streak <span class="am-num">21</span></span></div><button class="am-raise" aria-label="Subir a régua"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M18 11l-6-6-6 6"/></svg></button></div>
  <div class="am-item is-done"><button class="am-mark is-done" aria-label="Feito. Desmarcar Academia"><svg class="am-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></button><div class="am-item-body"><span class="am-item-name">Academia</span><span class="am-item-meta"><span class="am-num">+10 XP · +5 ouro</span></span></div><button class="am-link">Desfazer</button></div>
  <div class="am-item is-paused"><button class="am-mark" aria-label="Marcar Meditar 15 minutos, opcional"></button><div class="am-item-body"><span class="am-item-name">Meditar 15 minutos</span><span class="am-item-meta"><span class="am-badge am-badge-opt">opcional</span>em pausa</span></div></div>
  <div class="am-item"><button class="am-mark" aria-label="Marcar Ligar para os pais"></button><div class="am-item-body"><span class="am-item-name">Ligar para os pais</span><span class="am-item-meta"><span class="am-badge am-badge-faz">Faz tempo</span>Última vez: <span class="am-num">12</span> dias</span></div></div>
  <div class="am-item"><button class="am-mark" aria-label="Marcar Ficar sem refrigerante"></button><div class="am-item-body"><span class="am-item-name">Ficar sem refrigerante</span><span class="am-item-meta">Ritmo: <span class="am-num">18</span> nos últimos 30 dias</span></div></div>
</div>
</body>
</html>
