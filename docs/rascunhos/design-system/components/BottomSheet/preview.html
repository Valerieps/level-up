<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>BottomSheet</title></head>
<body>
<div style="padding:16px 16px 0;background:var(--canvas)">
<section class="am-sheet" role="dialog" aria-labelledby="sh-t">
  <div class="am-sheet-grab"></div>
  <h2 id="sh-t">Subir a régua</h2>
  <p>"Ler 30 minutos" virou automático. Quem sobe a régua ganha uma Estrela de Coragem: <strong>+10% de XP para sempre</strong> neste hábito.</p>
  <div class="am-choices" role="radiogroup">
    <button class="am-choice" role="radio" aria-checked="true"><span>Fácil → Média<small>Aumentar a dificuldade</small></span><span class="am-xpdelta">10 → 17 XP</span></button>
    <button class="am-choice" role="radio" aria-checked="false"><span>Adicionar sábado<small>4 dias por semana</small></span><span class="am-xpdelta">+1 dia</span></button>
  </div>
  <button class="am-btn am-btn-primary am-btn-block">Subir a régua</button>
  <button class="am-btn am-btn-ghost am-btn-block">Agora não</button>
</section>
</div>
</body>
</html>
