<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Toast</title></head>
<body>
<div class="am-stack" style="gap:12px">
  <div><span class="am-gain">+10 XP · +5 ouro</span></div>
  <div class="am-toast" role="status">Boa escolha. Hábito do tamanho certo é hábito que fica.</div>
  <div class="am-toast" role="alert">Não foi possível salvar. Verifique a conexão.<button class="am-btn am-btn-ghost">Tentar de novo</button></div>
</div>
</body>
</html>
